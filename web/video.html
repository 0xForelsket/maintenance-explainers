const proj = (v) => { const p = v.clone().project(cam); return [(p.x * 0.5 + 0.5) * W, (-p.y * 0.5 + 0.5) * H, p.z]; };
function updateLabels(t) {
  for (const L of LABELS) {
    const a = ss(L.t0, L.t0 + 0.3, t) * (1 - ss(L.t1 - 0.25, L.t1, t));
    const vis = a > 0.001;
    L.el.style.display = vis ? 'block' : 'none';
    [L.line, L.dot, L.ring].forEach((e) => e.style.display = vis ? '' : 'none');
    if (!vis) continue;
    const anchor = L.hero != null ? S.heroes[L.hero].mesh.position : S.anchors[L.anchor];
    const [x, y] = proj(anchor);
    const g = ss(L.t0, L.t0 + 0.28, t);
    const lx = x + L.dx * g, ly = y + L.dy * g;
    L.line.setAttribute('x1', x); L.line.setAttribute('y1', y); L.line.setAttribute('x2', lx); L.line.setAttribute('y2', ly);
    L.line.style.opacity = a; L.dot.setAttribute('cx', x); L.dot.setAttribute('cy', y); L.dot.style.opacity = a;
    const pr = (t - L.t0) % 1.2;
    L.ring.setAttribute('cx', x); L.ring.setAttribute('cy', y); L.ring.setAttribute('r', 10 + pr * 30); L.ring.style.opacity = a * (1 - pr / 1.2);
    const bw = L.el.offsetWidth, bh = L.el.offsetHeight;
    let left = L.dx < 0 ? lx - bw : lx, top = ly - bh / 2;
    left = Math.max(56, Math.min(W - 56 - bw, left)); top = Math.max(170, Math.min(1180 - bh, top));
    const ax = L.dx < 0 ? left + bw : left, ay = top + bh / 2;
    L.line.setAttribute('x2', ax); L.line.setAttribute('y2', ay);
    L.el.style.left = left + 'px'; L.el.style.top = top + 'px';
    L.el.style.opacity = ss(L.t0 + 0.15, L.t0 + 0.4, t) * (1 - ss(L.t1 - 0.25, L.t1, t));
  }
}

const titleEl = document.getElementById('title');
const tlEl = document.getElementById('tl');
const hudEl = document.getElementById('hud');
const endEl = document.getElementById('end');
const dotsEl = tlEl.querySelector('.dots');
for (let i = 0; i < 12; i++) dotsEl.appendChild(document.createElement('i'));
function updateOverlay(t, st) {
  updateCaptions(t);
  updateLabels(t);
  // title
  const ta = ss(6.95, 7.35, t) * (1 - ss(8.45, 8.75, t));
  titleEl.style.opacity = ta;
  titleEl.querySelector('.big').style.letterSpacing = (0.14 - 0.08 * easeOut(clamp01((t - 6.95) / 1.6))).toFixed(3) + 'em';
  titleEl.querySelector('.rule').style.width = (420 * easeOut(clamp01((t - 7.1) / 0.6))).toFixed(0) + 'px';
  // time-lapse counter
  const tla = ss(25.95, 26.2, t) * (1 - ss(28.2, 28.42, t));
  tlEl.style.opacity = tla;
  const wk = Math.max(1, Math.min(12, 1 + Math.floor(11 * clamp01((t - 26.0) / 2.3))));
  tlEl.querySelector('.v').textContent = 'WEEK ' + wk;
  dotsEl.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < wk));
  // pressure HUD
  const ha = (ss(28.55, 28.9, t) * (1 - ss(36.6, 36.85, t))) + ss(44.4, 44.8, t) * (1 - ss(45.95, 46.15, t));
  hudEl.style.opacity = ha;
  if (ha > 0) {
    const dp = st.p1 - st.p2;
    document.getElementById('p1').textContent = st.p1.toFixed(1) + ' bar';
    document.getElementById('p2').textContent = st.p2.toFixed(1) + ' bar';
    const dpEl = document.getElementById('dp');
    dpEl.textContent = dp.toFixed(1) + ' bar';
    const danger = clamp01((dp - 0.5) / 1.8);
    const col = danger < 0.35 ? 'var(--green)' : danger < 0.75 ? 'var(--amber)' : 'var(--red)';
    dpEl.style.color = col;
    const fl = Math.round(st.flow * 100);
    document.getElementById('flowv').textContent = fl + '%';
    const fb = document.getElementById('flowbar'); fb.style.width = fl + '%'; fb.style.background = col;
  }
  // end card
  const ea = ss(46.35, 46.9, t);
  endEl.style.opacity = ea;
  endEl.style.transform = `translateY(${((1 - easeOut(clamp01((t - 46.35) / 0.9))) * 30).toFixed(1)}px)`;
  endEl.querySelector('.tag').style.opacity = ss(47.25, 47.6, t);
}

// ---------------------------------------------------------------- frame
window.renderFrame = (t) => {
  const { shot, p } = placeCamera(t);
  let cut = null;
  if (shot.closeCut) cut = 1 - ss(46.4, 47.9, t);
  const st = S.update(t, { cut, camPos: cam.position });
  // lights per shot
  S.lights.headlamp.intensity = shot.headlamp || 0;
  S.lights.headlamp.position.copy(cam.position).add(new V3(0, 0.2, 0));
  const key = S.lights.key;
  if (shot.id === 'S2') {
    const u = ease(p);
    key.position.set(-18 + 9 * u, 13, 6 + 10 * u);
  } else key.position.set(-9, 13, 16);
  // exposure / fades
  let exp = 1.0, fade = 1;
  if (t < 0.7) fade = ss(0.0, 0.7, t);
  if (shot.id === 'S2') exp = 0.35 + 0.65 * ss(4.55, 5.4, t);
  if (t > 49.05) fade = 1 - ss(49.05, 49.85, t);
  renderer.toneMappingExposure = exp;
  grade.uniforms.uFade.value = fade;
  grade.uniforms.uWarn.value = st.warn;
  grade.uniforms.uTime.value = t;
  grade.uniforms.uFlash.value = 0.06 * Math.exp(-Math.max(0, t - T.heroImpact[0]) / 0.06) * (t >= T.heroImpact[0] ? 1 : 0) + 0.05 * (t >= 39.32 ? Math.exp(-(t - 39.32) / 0.12) : 0);
  bloom.strength = 0.42 + 0.12 * st.valve;
  comp.render();
  updateOverlay(t, st);
  document.getElementById('ov').style.opacity = fade;
  return { shot: shot.id };
};
window.ready = true;
</script></body></html>
