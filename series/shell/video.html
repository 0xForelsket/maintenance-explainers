  if (hud && hud.opacity > 0) {
    const key = hud.items.map((i) => i.k).join('|') + (hud.bar ? 'bar' : '');
    if (key !== hudKey) {
      hudEl.innerHTML = `<div class="row">${hud.items.map((i, n) => `<div class="it ${i.big ? 'big' : ''}" style="text-align:${n === 0 ? 'left' : n === hud.items.length - 1 ? 'right' : 'center'}"><div class="k">${i.k}</div><div class="v"></div></div>`).join('')}</div>`
        + (hud.bar ? `<div class="row" style="margin-top:22px"><div class="k bk"></div><div class="k bv" style="color:#fff"></div></div><div class="bar"><i></i></div>` : '');

    }
    const vs = hudEl.querySelectorAll('.v');
    hud.items.forEach((i, n) => { vs[n].textContent = i.v; vs[n].style.color = i.color || '#fff'; });

    if (hud.spark) {
      if (!sp) { hudEl.insertAdjacentHTML('beforeend', '<svg class="spark" width="940" height="190" style="display:block;margin-top:22px;overflow:visible"></svg>'); sp = hudEl.querySelector('svg.spark'); }
      const { values, lo, hi, n, color, band, unit } = hud.spark; const W2 = 940, H2 = 150;
      const xs = (i) => 20 + (i / (values.length - 1)) * (W2 - 40), ys = (v) => 10 + (1 - (v - lo) / (hi - lo)) * H2;
      const shown = values.slice(0, Math.max(1, n));
      const d = shown.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
      const bandRect = band ? `<rect x="20" y="${ys(band[1])}" width="${W2 - 40}" height="${ys(band[0]) - ys(band[1])}" fill="rgba(111,240,176,0.10)" stroke="rgba(111,240,176,0.35)" stroke-dasharray="6 6"/>` : '';
      const last = shown[shown.length - 1];
      sp.innerHTML = `${bandRect}<line x1="20" y1="${10 + H2}" x2="${W2 - 20}" y2="${10 + H2}" stroke="rgba(255,255,255,0.18)"/>`
        + `<path d="${d}" fill="none" stroke="${color}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`
        + shown.map((v, i) => `<circle cx="${xs(i)}" cy="${ys(v)}" r="${i === shown.length - 1 ? 10 : 6}" fill="${i === shown.length - 1 ? color : '#0b1117'}" stroke="${color}" stroke-width="3"/>`).join('')
        + `<text x="${Math.min(W2 - 30, xs(shown.length - 1) + 18)}" y="${ys(last) - 16}" fill="#fff" font-family="JetBrains Mono" font-weight="700" font-size="30">${last.toFixed(1)}${unit || ''}</text>`;
    } else if (sp) sp.remove();
    if (hud.bar) {
      hudEl.querySelector('.bk').textContent = hud.bar.k; hudEl.querySelector('.bv').textContent = hud.bar.text;
      const b = hudEl.querySelector('.bar i'); b.style.width = (clamp01(hud.bar.v) * 100).toFixed(1) + '%'; b.style.background = hud.bar.color || 'var(--green)';
    }
  }
  // time-lapse counter
  const ct = DIR.counter ? DIR.counter(t, st) : null;

  cardEl.style.opacity = card ? ss(card.t0, card.t0 + 0.35, t) * (1 - ss(card.t1 - 0.3, card.t1, t)) : 0;
  if (card) {

      cardEl.querySelector('.h').textContent = card.title;
      cardEl.querySelector('ul').innerHTML = card.items.map((it, n) => `<li><span class="ic">${card.kind === 'warn' ? '!' : n + 1}</span><span>${it.text}</span></li>`).join('');
      cardKey = key;

  }
  cardVisible = !!card && parseFloat(cardEl.style.opacity) > 0.02; cardBottom = cardVisible ? cardEl.offsetTop + cardEl.offsetHeight : 0;
  hudVisible = !!hud && hud.opacity > 0.02; hudBottom = hudVisible ? hudEl.offsetTop + hudEl.offsetHeight : 0;
  updateLabels(t);
  // end card
  endEl.style.opacity = ss(END.t0, END.t0 + 0.55, t);
  endEl.style.transform = `translateY(${((1 - easeOut(clamp01((t - END.t0) / 0.9))) * 30).toFixed(1)}px)`;
  endEl.querySelector('.tag').style.opacity = ss(END.t0 + 0.9, END.t0 + 1.25, t);
  endEl.querySelector('.series').style.opacity = ss(END.t0 + 1.4, END.t0 + 1.8, t);
}

// ---------------------------------------------------------------- frame
const TOTAL = DIR.TOTAL || Math.ceil(timeline.total);

};

window.__dbg = { renderer, S, comp, cam, THREE };
window.ready = true;
